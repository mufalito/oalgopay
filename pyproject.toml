[project]
name = "oalgopay"
version = "0.1.0"
description = "Self-hosted Blocknet (BNT) payment gateway: merchant REST API, pay page with QR, admin panel, signed webhooks."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.129",
    "uvicorn>=0.36",
    "httpx>=0.28",
    "qrcode>=8.0",
    "jinja2>=3.1",
    "cryptography>=45.0",
]

[dependency-groups]
dev = []
