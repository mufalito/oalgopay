<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OalgoPay — Setup</title>
<link rel="stylesheet" href="/static/admin.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<main style="max-width:720px;margin:0 auto;padding:32px 16px;">
  <div class="brand" style="font-size:20px;margin-bottom:4px;">OalgoPay <span class="dim">setup</span></div>
  <div style="color:var(--muted);margin-bottom:20px;">First run — set your secrets, point at your Blocknet core, done. Everything else has a working default.</div>
  <div id="check-result"></div>

  <form hx-post="/setup" hx-target="#check-result" hx-swap="innerHTML" class="settings-form" style="gap:18px;">

    <h2 style="margin:0;">Core connection</h2>
    <label>Core API address
      <input name="api_base" value="{{ api_base }}" placeholder="http://127.0.0.1:18512">
    </label>
    <label>Core data directory (contains api.cookie)
      <input name="datadir" value="{{ datadir }}">
    </label>
    <button type="button" class="btn" id="check-btn"
            hx-get="/setup/check" hx-trigger="click" hx-target="#check-result" hx-swap="innerHTML"
            hx-include="[name='api_base'],[name='datadir']">Test connection</button>

    <h2 style="margin:8px 0 0;">Secrets</h2>
    <label>Admin password (min 8 chars)
      <input name="admin_password" id="pw" type="text" value="{{ suggest_pw }}" autocomplete="off" required>
    </label>
    <label>Merchant API token (min 16 chars)
      <input name="api_token" id="tok" type="text" value="{{ suggest_token }}" autocomplete="off" required>
    </label>
    <button type="button" class="btn" onclick="regen()">Regenerate both</button>

    <h2 style="margin:8px 0 0;">Public links</h2>
    <label>Public base URL (used for pay links / QR page)
      <input name="public_base_url" value="{{ public_base_url }}">
    </label>

    <h2 style="margin:8px 0 0;">Payments (defaults are fine)</h2>
    <label>Confirmations required (1–20)
      <input type="number" name="confirmations_required" min="1" max="20" value="{{ confirmations }}">
    </label>
    <label>Invoice expiry (minutes)
      <input type="number" name="expiry_minutes" min="1" max="10080" value="{{ expiry }}">
    </label>
    <label>Display handle (blank = raw address)
      <input name="display_handle" value="{{ display_handle }}" placeholder="$yourname">
    </label>
    <label>Webhook URL (optional — you can add it later in the panel)
      <input name="webhook_url" placeholder="https://shop.example.com/hooks/oalgopay">
    </label>

    <button class="btn primary" type="submit">Finish setup</button>
  </form>
</main>
<script>
function regen() {
  var b = crypto.getRandomValues(new Uint8Array(8));
  var t = crypto.getRandomValues(new Uint8Array(24));
  var hex = a => [...a].map(x => x.toString(16).padStart(2, "0")).join("");
  document.getElementById("pw").value = hex(b);
  document.getElementById("tok").value = hex(t);
}
</script>
</body>
</html>
