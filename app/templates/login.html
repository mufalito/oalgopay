<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OalgoPay — Sign in</title>
<link rel="stylesheet" href="/static/tailwind.css">
<script src="/static/htmx.min.js"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-800">
  <form class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-8 shadow-sm"
        hx-post="/admin/login" hx-target="#login-error" hx-swap="innerHTML">
    <div class="mb-6 text-lg font-semibold text-slate-800">OalgoPay <span class="font-normal text-slate-400">gateway</span></div>
    <input type="password" name="password" placeholder="admin password" autocomplete="current-password" required
           class="input mb-3">
    <button type="submit" class="btn btn-primary w-full">Sign in</button>
    <div class="mt-3 text-sm text-peach-700" id="login-error"></div>
  </form>
</body>
</html>
