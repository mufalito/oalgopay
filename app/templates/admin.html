<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OalgoPay — Admin</title>
<link rel="stylesheet" href="/static/admin.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<nav>
  <div class="brand">OalgoPay</div>
  <div class="nav-links">
    <a href="#overview" data-view="overview">Overview</a>
    <a href="#invoices" data-view="invoices">Invoices</a>
    <a href="#webhooks" data-view="webhooks">Webhooks</a>
    <a href="#send" data-view="send">Send</a>
    <a href="/docs" target="_blank" rel="noopener" class="ext">API Docs ↗</a>
    <a href="#settings" data-view="settings">Settings</a>
  </div>
</nav>

<main>
  <section id="view-overview" class="view"><h1>Overview</h1></section>
  <section id="view-invoices" class="view"><h1>Invoices</h1></section>
  <section id="view-webhooks" class="view"><h1>Webhooks</h1></section>
  <section id="view-send" class="view"><h1>Send</h1></section>
  <section id="view-settings" class="view"><h1>Settings</h1></section>
</main>

<script>
(function () {
  "use strict";
  var urls = {
    overview: "/admin/frag/overview",
    invoices: "/admin/frag/invoices",
    send: "/admin/frag/send",
    webhooks: "/admin/frag/webhooks",
    settings: "/admin/frag/settings",
  };
  function setView(name) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    var view = document.getElementById("view-" + name);
    if (view) view.classList.add("active");
    document.querySelectorAll(".nav-links a").forEach(function (a) {
      a.classList.toggle("active", a.dataset.view === name);
    });
  }
  function load(name) {
    if (!urls[name]) return;
    htmx.ajax("GET", urls[name], { target: "#view-" + name, swap: "innerHTML" });
  }
  function activate(name) { setView(name); load(name); }
  document.querySelectorAll('.nav-links a[data-view]').forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var name = a.dataset.view;
      if (location.hash !== "#" + name) location.hash = name; // fires hashchange -> activate
      else activate(name);
    });
  });
  window.addEventListener("hashchange", function () {
    activate(location.hash.slice(1) || "overview");
  });
  function boot() { activate(location.hash.slice(1) || "overview"); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
