{% if rows %}
<div class="banner-warn">
  <div>
    {% for r in rows %}
    <div class="flex items-baseline justify-between gap-3 py-0.5 text-sm">
      <span class="klabel">{{ r.k }}</span>
      <span class="{{ 'text-mint-700' if r.ok else 'text-peach-700' }}">{% if r.ok %}✓{% else %}✗{% endif %} {{ r.v }}</span>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
