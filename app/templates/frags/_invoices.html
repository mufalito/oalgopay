<form class="mb-4 flex flex-wrap gap-2" hx-post="/admin/frag/invoice" hx-swap="none"
      hx-on::after-request="if(event.detail.successful) this.reset()">
  <input name="amount_bnt" placeholder="amount (BNT)" inputmode="decimal" required class="input w-36">
  <input name="label" placeholder="label (optional)" class="input flex-1">
  <input name="expires_in_min" placeholder="expiry min" inputmode="numeric" class="input w-28">
  <button class="btn btn-primary" type="submit">Create</button>
</form>
<div class="mb-4 flex flex-wrap gap-2" id="inv-filters">
  {% for s in ["", "pending", "seen", "confirmed", "expired", "cancelled"] %}
  <button class="chip{% if s == status %} chip-active{% endif %}"
          hx-get="/admin/frag/invoices-table{% if s %}?status={{ s }}{% endif %}"
          hx-target="#inv-table-wrap" hx-swap="innerHTML"
          onclick="[...this.parentElement.children].forEach(b => b.classList.remove('chip-active')); this.classList.add('chip-active')">
    {{ s if s else "all" }}
  </button>
  {% endfor %}
</div>

<div id="inv-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 p-4"
     onclick="if (event.target === this) closeInvModal()">
  <div class="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-lg bg-white shadow-xl">
    <div id="inv-detail"></div>
  </div>
</div>
<script>
(function () {
  if (window.__invModalInit) return;
  window.__invModalInit = true;
  window.closeInvModal = function () {
    var m = document.getElementById("inv-modal");
    if (!m) return;
    m.classList.add("hidden"); m.classList.remove("flex");
    document.getElementById("inv-detail").innerHTML = "";
  };
  document.addEventListener("htmx:afterSwap", function (e) {
    if (e.target.id === "inv-detail" && e.target.innerHTML.trim()) {
      var m = document.getElementById("inv-modal");
      m.classList.remove("hidden"); m.classList.add("flex");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") window.closeInvModal();
  });
})();
</script>
<div id="inv-table-wrap">
  {% include "frags/_invoices_table.html" %}
</div>
