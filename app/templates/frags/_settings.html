<div id="settings-frag">
  {% if saved %}<div class="banner-ok mb-4">Settings saved</div>{% endif %}
  <form class="max-w-md space-y-4" hx-post="/admin/frag/settings" hx-target="#settings-frag" hx-swap="outerHTML">
    <label class="block text-sm text-slate-600">Confirmations required
      <input type="number" name="confirmations_required" min="1" max="20" value="{{ settings.confirmations_required }}" class="input mt-1"></label>
    <label class="block text-sm text-slate-600">Default expiry (minutes)
      <input type="number" name="expiry_minutes" min="1" max="10080" value="{{ settings.expiry_minutes }}" class="input mt-1"></label>
    <label class="block text-sm text-slate-600">Amount fallback matching
      <select name="amount_fallback_matching" class="input mt-1">
        <option value="1" {% if settings.amount_fallback_matching == "1" %}selected{% endif %}>enabled (memo, then exact amount)</option>
        <option value="0" {% if settings.amount_fallback_matching == "0" %}selected{% endif %}>disabled (memo only)</option>
      </select></label>
    <label class="block text-sm text-slate-600">Display handle (blank = raw address)
      <input name="display_handle" placeholder="$yourname" value="{{ settings.display_handle }}" class="input mt-1"></label>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>
