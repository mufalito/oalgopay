<div id="settings-frag">
  {% if saved %}<div class="banner ok">Settings saved</div>{% endif %}
  <form class="settings-form" hx-post="/admin/frag/settings" hx-target="#settings-frag" hx-swap="outerHTML">
    <label>Confirmations required
      <input type="number" name="confirmations_required" min="1" max="20" value="{{ settings.confirmations_required }}"></label>
    <label>Default expiry (minutes)
      <input type="number" name="expiry_minutes" min="1" max="10080" value="{{ settings.expiry_minutes }}"></label>
    <label>Amount fallback matching
      <select name="amount_fallback_matching">
        <option value="1" {% if settings.amount_fallback_matching == "1" %}selected{% endif %}>enabled (memo, then exact amount)</option>
        <option value="0" {% if settings.amount_fallback_matching == "0" %}selected{% endif %}>disabled (memo only)</option>
      </select></label>
    <label>Display handle (blank = raw address)
      <input name="display_handle" placeholder="$yourname" value="{{ settings.display_handle }}"></label>
    <button class="btn primary" type="submit">Save</button>
  </form>
</div>
